<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — 这一页走丢了 · xx</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23B34A28'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23F2EEE4'/%3E%3Cpath d='M8 13V5l6 4z' fill='%23F2EEE4'/%3E%3Cpath d='M24 13V5l-6 4z' fill='%23F2EEE4'/%3E%3Ccircle cx='12.5' cy='17' r='1.3' fill='%23B34A28'/%3E%3Ccircle cx='19.5' cy='17' r='1.3' fill='%23B34A28'/%3E%3Cpath d='M14.5 21q1.5 1.4 3 0' stroke='%23B34A28' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f2eee4; --ink: #14120e; --muted: #6b6459; --accent: #b34a28;
      --line: rgba(20,18,14,.14); --line-strong: rgba(20,18,14,.32);
      --display: Georgia, "Times New Roman", "Songti SC", "STSong", "Noto Serif SC", SimSun, serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper:#12110f; --ink:#f2eee4; --muted:#9a9285; --accent:#d96a45;
        --line:rgba(242,238,228,.14); --line-strong:rgba(242,238,228,.32); color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    a { color: inherit; }
    body {
      margin: 0; min-height: 100svh; display: flex; flex-direction: column;
      background: var(--paper); color: var(--ink);
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      width: min(1280px, 100% - 40px); margin: 0 auto; padding: 22px 0;
      border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 9px;
      letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
    }
    .top a { color: inherit; text-decoration: none; }
    .top a:hover { color: var(--accent); }
    main {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      width: min(1280px, 100% - 40px); margin: 0 auto; padding: 64px 0;
    }
    .code {
      font-family: var(--display); font-size: clamp(96px, 20vw, 240px);
      line-height: .84; letter-spacing: -.03em;
    }
    .code span { color: var(--accent); }
    h1 {
      font-family: var(--display); font-weight: 400;
      font-size: clamp(28px, 4vw, 52px); line-height: 1.2; margin: 28px 0 0;
    }
    p { color: var(--muted); margin: 14px 0 0; font-size: 14px; line-height: 1.8; }
    .actions { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 34px; }
    .actions a {
      font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
      text-transform: uppercase; text-decoration: none; padding-bottom: 4px;
      border-bottom: 1px solid var(--accent);
    }
    .actions a:hover { color: var(--accent); }
    footer {
      width: min(1280px, 100% - 40px); margin: 0 auto; padding: 18px 0 22px;
      border-top: 1px solid var(--line); display: flex; justify-content: space-between;
      gap: 16px; font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="top">
    <a href="./">xx · XXYOUKA</a>
    <span>Error / 404</span>
  </header>
  <main>
    <p style="margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)">Page not found</p>
    <div class="code">4<span>0</span>4</div>
    <h1>这一页走丢了。</h1>
    <p>可能是一只猫把它叼走了。回首页看看别的吧。<br>This page wandered off — probably a cat took it.</p>
    <div class="actions">
      <a href="./">回到首页 / Home</a>
      <a href="https://github.com/xxyouka">GitHub ↗</a>
    </div>
  </main>
  <footer>
    <span>Issue 01 · 2026</span>
    <span>Guangzhou · 23.1°N</span>
  </footer>
</body>
</html>
